# ModSecurity v3 + OWASP CRS (nginx)
# 首日验证过正常业务无阻断后切 On；降级时改回 DetectionOnly 并 reload。
SecRuleEngine On

SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 131072
SecRequestBodyNoFilesLimit 131072

SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /var/log/nginx/modsec_audit.json

SecDataDir /var/lib/modsecurity/data
SecTmpDir /tmp/modsecurity

Include /etc/modsecurity/crs/crs-setup.conf
Include /etc/modsecurity/crs/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
Include /usr/share/modsecurity-crs/rules/*.conf
Include /etc/modsecurity/crs/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
Include /etc/nginx/modsec/crs-overrides.conf
