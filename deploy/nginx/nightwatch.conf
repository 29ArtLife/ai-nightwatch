log_format nw_json escape=json
  '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
  '"path":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"ua":"$http_user_agent","rt":$request_time,"xff":"$http_x_forwarded_for"}';

limit_req_zone $binary_remote_addr zone=nw_req:10m rate=20r/s;

server {
    listen 8081 default_server;
    server_name _;

    access_log /var/log/nginx/nw_access.log nw_json;
    error_log  /var/log/nginx/nw_error.log warn;

    limit_req zone=nw_req burst=40 nodelay;
    limit_req_status 429;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加：防止攻击者伪造 XFF 嫁祸他人
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
