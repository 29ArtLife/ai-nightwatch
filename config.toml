[mode]
demo = true
auto_response = true

[server]
host = "0.0.0.0"
port = 8080
# 留空则启动时随机生成并写入 data/token.txt（前端首次访问需输入）
token = ""
trusted_proxies = ["127.0.0.1"]

[ingest]
# 演示站写入的 JSONL，由主进程 tail -F
[[ingest.sources]]
name = "app_access"
path = "logs/app_access.jsonl"
parser = "jsonl_http"
[[ingest.sources]]
name = "app_auth"
path = "logs/app_auth.jsonl"
parser = "jsonl_auth"
[[ingest.sources]]
name = "suricata"
path = "/var/log/suricata/eve.json"
parser = "suricata_eve"
[[ingest.sources]]
name = "waf"
path = "/var/log/nginx/modsec_audit.log"
parser = "modsec_json"
[[ingest.sources]]
name = "nginx"
path = "/var/log/nginx/nw_access.log"
parser = "nginx_json"

[detect.brute]
window_sec = 60
fail_threshold = 5

[detect.scan]
window_sec = 60
status_404_threshold = 8
distinct_sensitive_paths = 5
sensitive_prefixes = [".env", ".git/config", "wp-login.php", "phpmyadmin", "admin.php", ".aws", "backup", "actuator", "console", "config.json"]

[enforce]
default_ttl_sec = 600
whitelist_ips = ["127.0.0.1", "::1", "10.2.102.143", "172.20.10.0/28"]
cooldown_sec = 30

[fw]
enabled = true
wrapper = "/usr/local/sbin/nw-fw"
timeout_sec = 5

[osv]
mode = "offline"          # offline | online
snapshot_dir = "osv"
api = "https://api.osv.dev"
include_querybatch = false  # true 时额外把“当前版本确实受影响”的漏洞并入报告
fail_on_unverified = true

[asset]
probe = "builtin"
allowed_targets = ["127.0.0.1", "10.2.102.143", "10.200.0.1"]
assets = [
  { id = "sshd", target = "127.0.0.1", port = 22, kind = "ssh", label = "本机 sshd" },
  { id = "fake-ssh", target = "127.0.0.1", port = 2222, kind = "ssh", label = "演示假服务" },
  { id = "demo-web", target = "127.0.0.1", port = 8081, kind = "http", label = "演示站" },
  { id = "lab-host", target = "10.200.0.1", port = 8081, kind = "http", label = "实验网宿主" },
]
timeout_sec = 2.0

[agent]
enabled = true
model = "deepseek-chat"
api = "https://api.deepseek.com/v1"
max_steps = 8
api_timeout_sec = 60
tool_timeout_sec = 45
max_output_bytes = 12000
allow_active_scans = true
scan_cooldown_sec = 60
# auto = AI 可直接封禁；approve = 只能提交建议
autonomy = "auto"
auto_ban_ttl = 600
max_auto_bans_per_min = 3

[reach]
project_dir = "demo/demo_project"
aliases_file = "demo/demo_project/module_aliases.json"

[report]
dir = "data/reports"
